[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon"
version = "0.0.1"
description = "Hierarchy-based management, automation, and monitoring system (Engine, Operator Client, Worker Client)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Engine host (environ-operator during development)
engine = [
    "asyncpg>=0.29",
    "psutil>=5.9",
    # In-process local LLM (Task). CPU wheels: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
    "llama-cpp-python>=0.3",
]
# Operator Client TUI -- built and used first, to test the system
tui = [
    "prompt_toolkit>=3.0",
]
# Operator Client GUI + Worker Client helper exes (Qt). Later phase.
gui = [
    "PySide6>=6.6",
    "qasync>=0.27",
]
# Worker Client (environ-worker)
worker = [
    "psutil>=5.9",
    "prompt_toolkit>=3.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["protocol*", "engine*", "operator_client*", "worker_client*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Windows Proactor transports finalised after the per-test loop closes -- harmless.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["environ-*"]
