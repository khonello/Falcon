<title>Falcon Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: an operations console. Fixed sider, sticky top bar with the global time range, a 12-column
   content grid of hairline panels. Dense 13px type, tabular figures, one accent, severity hues only. */
:root {
  color-scheme: light;
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #f8f9fb; --surface-3: #eef0f3;
  --border: #e2e5ea; --border-strong: #cdd2da; --grid: #eef0f3;
  --text: #191d25; --text-2: #4a5160; --text-3: #737b8a; --text-4: #a6adb9;
  --accent: #2459d6; --accent-soft: rgba(36,89,214,0.09);
  --crit: #c8331f; --high: #d4610f; --med: #b58105; --low: #5b6b85; --ok: #1d8a4f;
  --s1: #2459d6; --s2: #0f8f8a; --s3: #7357d9; --s4: #d4610f; --s5: #b58105; --s6: #8a94a6;
  --own: #c9ced7;
  --shadow-pop: 0 8px 24px -6px rgba(16,24,40,0.18), 0 2px 6px rgba(16,24,40,0.06);
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c0f14; --surface: #12161d; --surface-2: #161b23; --surface-3: #1d232d;
    --border: #232a35; --border-strong: #323b48; --grid: #1c222b;
    --text: #e4e7ed; --text-2: #aab1be; --text-3: #7c8595; --text-4: #555e6d;
    --accent: #5b8cff; --accent-soft: rgba(91,140,255,0.13);
    --crit: #f2604c; --high: #f08a3e; --med: #d9a93a; --low: #8796b0; --ok: #3fb877;
    --s1: #5b8cff; --s2: #2bb8b1; --s3: #9a85f2; --s4: #f08a3e; --s5: #d9a93a; --s6: #7d889b;
    --own: #3a4352;
    --shadow-pop: 0 10px 30px -6px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0f14; --surface: #12161d; --surface-2: #161b23; --surface-3: #1d232d;
  --border: #232a35; --border-strong: #323b48; --grid: #1c222b;
  --text: #e4e7ed; --text-2: #aab1be; --text-3: #7c8595; --text-4: #555e6d;
  --accent: #5b8cff; --accent-soft: rgba(91,140,255,0.13);
  --crit: #f2604c; --high: #f08a3e; --med: #d9a93a; --low: #8796b0; --ok: #3fb877;
  --s1: #5b8cff; --s2: #2bb8b1; --s3: #9a85f2; --s4: #f08a3e; --s5: #d9a93a; --s6: #7d889b;
  --own: #3a4352;
  --shadow-pop: 0 10px 30px -6px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; line-height: 1.5;
       font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); } .t4 { color: var(--text-4); }
.b { font-weight: 600; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--surface); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; padding: 10px 8px; gap: 1px; }
.org { display: flex; align-items: center; gap: 9px; padding: 6px 8px 12px; }

.nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

.nav .cnt.hot { color: var(--crit); font-weight: 500; }
.side-foot > span { white-space: nowrap; }
.side-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; font-size: 12px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; min-height: 50px; display: flex; align-items: center; gap: 12px;
       padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--text-3); white-space: nowrap; min-width: 0; max-width: 46vw; }

.crumb b { color: var(--text); font-weight: 600; font-size: 14px; }

          border-radius: 5px; color: var(--text-3); background: var(--surface-2); cursor: pointer; }
.kbd { font-family: var(--mono); font-size: 11px; padding: 0 5px; border: 1px solid var(--border-strong); border-radius: 3px; color: var(--text-3); margin-left: auto; }

.content { padding: 18px 20px 48px; display: flex; flex-direction: column; gap: 14px; }

.ph1 .sub { color: var(--text-3); margin-top: 2px; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; min-width: 0; }
.phd { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.pt { font-weight: 600; font-size: 13px; }
.pt small { font-weight: 400; color: var(--text-3); font-size: 12px; margin-left: 8px; }
.pbd { padding: 14px; }
.pbd.flush { padding: 0; }
.g { display: grid; gap: 14px; }
.c-75 { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.c-84 { grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); }
.c-66 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.kpi { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; flex: none; }
.kpi .v small { font-size: 13px; font-weight: 400; color: var(--text-3); margin-left: 3px; }
.kpi .d { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sp { flex: 1; }

.sev { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sev i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.st i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 0 6px; height: 20px; border-radius: 3px;
       background: color-mix(in srgb, var(--c, var(--text-3)) 12%, transparent); color: var(--c, var(--text-2)); white-space: nowrap; font-weight: 500; }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: visible; }
.bar > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--c, var(--s1)); }

      box-shadow: var(--shadow-pop); padding: 7px 9px; font-size: 12px; white-space: nowrap; z-index: 10; }

.stream { display: flex; flex-direction: column; max-height: 316px; overflow: auto; }
.ev { display: grid; grid-template-columns: 62px 10px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 6px 14px; border-bottom: 1px solid var(--grid); }
.ev > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.hm-tile { width: 46px; height: 46px; border-radius: 4px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 500; cursor: pointer;
           transition: transform .12s; }

.meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 20px; }
.meta .k { color: var(--text-3); font-size: 12px; }
.meta .v { font-weight: 500; }
.irow { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto 64px; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--grid); cursor: pointer; }
.irow:hover { background: var(--surface-2); }
.irow.on { background: var(--accent-soft); }
.irow > i { width: 8px; height: 8px; border-radius: 2px; }
.irow .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.irow > .mono { white-space: nowrap; }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.kv.chk { grid-template-columns: 18px minmax(0, 1fr) auto; }
.src { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; white-space: nowrap; cursor: default; }
.src i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.frow { display: grid; grid-template-columns: 16px 112px 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 14px; cursor: pointer; }
.frow:hover { background: var(--surface-2); }
@media (max-width: 760px) { .frow { grid-template-columns: 16px 1fr auto; } .frow > :nth-child(3), .frow > :nth-child(4) { display: none; } }
.wizard { max-width: 980px; width: 100%; margin: 0 auto; }
.wiz-body { padding: 32px 28px 36px; min-height: 380px; }
.choice { flex: 1 1 220px; min-width: 0; border: 1px solid var(--border); border-radius: 6px; padding: 16px; cursor: pointer; background: var(--surface); transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--border-strong); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); }
.choice .ci { width: 28px; height: 28px; border-radius: 5px; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); flex: none; }
.choice.on .ci { background: var(--accent); color: #fff; }
@media (max-width: 680px) { .wiz-body { padding: 22px 16px 26px; } }
.reveal { animation: reveal .35s cubic-bezier(.2,.8,.2,1); }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } }
.hl-wrap { position: relative; }
.hl-bg { position: absolute; inset: 0; background: var(--surface); border-radius: 4px; }
.hl-mirror, .hl-ta { font-family: var(--sans); font-size: 13.5px; line-height: 1.7; padding: 8px 11px; border: 1px solid transparent; white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; letter-spacing: normal; }
.hl-mirror { position: absolute; inset: 0; color: transparent; pointer-events: none; overflow: hidden; }
.hl-ta { position: relative; z-index: 1; display: block; width: 100%; min-height: 96px; resize: none; overflow: hidden; background: transparent; color: var(--text); border-color: var(--border-strong); border-radius: 4px; outline: none; margin: 0; }
.hl-ta:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.hl-ta::placeholder { color: var(--text-4); }
.hl { border-radius: 2px; box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--c) 55%, transparent); background-image: none; }
.hl:not(.ok):not(.ig) { box-shadow: none; background: linear-gradient(to right, var(--c) 50%, transparent 50%) left bottom / 4px 1.5px repeat-x; }
.hl.ok { background: color-mix(in srgb, var(--c) 18%, transparent); box-shadow: inset 0 -2px 0 var(--c); }
.hl.ig { box-shadow: none; }
.pick { position: absolute; z-index: 5; width: 310px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; box-shadow: var(--shadow-pop); padding: 6px; }
.pick-i { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 4px; cursor: pointer; color: var(--text); font: inherit; }
.pick-i:hover, .pick-i:focus-visible { background: var(--accent-soft); outline: none; }
.fchip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
.fchip i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); display: inline-block; }
.fchip:hover { border-color: var(--border-strong); }
.nt-h { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
.nt-sec { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.nt-sub { font-size: 12px; font-weight: 500; color: var(--text-2); padding-bottom: 2px; }
.decide { padding: 12px 14px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); background: color-mix(in srgb, var(--c) 9%, transparent); }
.breathe { animation: breathe 1.2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }
.su-banner { position: relative; display: flex; flex-wrap: nowrap; white-space: nowrap; align-items: center; gap: 10px; padding: 8px 20px; background: color-mix(in srgb, var(--crit) 12%, var(--surface)); color: var(--crit); border-bottom: 1px solid color-mix(in srgb, var(--crit) 30%, transparent); }
.su-banner span:not(.sp):not(.mono) { color: var(--text); }
.su-banner > span:nth-of-type(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.su-banner > * { flex: none; } .su-banner > span:nth-of-type(2) { flex: 0 1 auto; } .su-banner > .sp { flex: 1 1 auto; }
.orgtxt { min-width: 0; } .orgtxt > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav.big { padding: 10px 12px; font-size: 14px; }
/* the Admin's three core areas lead the menu as their own group, ruled off below; the entries look like every other */
/* Tasks: four cards that are also the filters, then one row per task with its line of time */
.tcards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.tcard { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: border-color .15s, background .15s; }
.tcard:hover { background: var(--surface-2); }
.tcard.on { background: var(--accent-soft); border-color: var(--accent); }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 210px 104px; gap: 16px; align-items: center; min-height: 61px; padding: 10px 14px; border-bottom: 1px solid var(--grid); cursor: pointer; }
.trow:hover { background: var(--surface-2); }
.trow.on { background: var(--accent-soft); }
.trow-line { min-width: 0; }
@media (max-width: 900px) { .tcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .trow { grid-template-columns: minmax(0, 1fr) 104px; } .trow-line { display: none; } }
.askbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); border-radius: 6px; background: var(--accent-soft); }
.askbar-t { min-width: 0; flex: 1 1 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi.link { cursor: pointer; transition: border-color .15s; }
.kpi.link:hover { border-color: var(--border-strong); }
.mtree .ant-tree-treenode { width: 100%; }
.mtree .ant-tree-node-content-wrapper { min-width: 0; flex: 1; }
.drow { display: grid; grid-template-columns: minmax(150px, 1.4fr) minmax(140px, 1.6fr) 70px minmax(120px, 1fr) 130px minmax(120px, 1fr); gap: 14px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--grid); cursor: pointer; }
.drow:hover { background: var(--surface-2); }
.drow-h { cursor: default; padding-top: 8px; padding-bottom: 8px; font-size: 12px; }
.drow-h:hover { background: transparent; }
.qrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--grid); }
.qi { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; font-size: 15px; background: color-mix(in srgb, var(--c) 12%, transparent); color: var(--c); }
.grow { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(0, 3fr); gap: 14px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--grid); }
.adm { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 1px solid var(--border); border-radius: 16px; }
.av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 600; background: var(--surface-3); color: var(--text-2); flex: none; }
@media (max-width: 1000px) { .drow { grid-template-columns: minmax(0, 1fr) auto; } .drow > :nth-child(n+3) { display: none; } .qrow { grid-template-columns: 34px minmax(0, 1fr); } .qrow > :nth-child(n+3) { grid-column: 2; justify-content: flex-start; } .grow { grid-template-columns: minmax(0, 1fr); } }
.c-work { grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); }
@media (max-width: 900px) { .c-work { grid-template-columns: minmax(0, 1fr); } .c-work > section:first-child { position: static !important; } }
.qitem { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--grid); }
.qitem:hover { background: var(--surface-2); }
.qitem.on { background: var(--accent-soft); }
.qitem.done { opacity: .7; }
.org-stem { width: 1px; height: 14px; background: var(--border-strong); margin: 0 auto 0; }
.org-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding-top: 12px; border-top: 1px solid var(--border-strong); }
.org-col { border: 1px solid var(--border); border-radius: 6px; padding: 14px; background: var(--surface); min-width: 0; }
.org-adm { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--grid); }
.org-empty { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1px dashed color-mix(in srgb, var(--crit) 50%, transparent); border-radius: 6px; background: color-mix(in srgb, var(--crit) 6%, transparent); cursor: pointer; }
.org-new { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-style: dashed; color: var(--text-3); cursor: pointer; min-height: 160px; background: transparent; }
.org-new:hover { color: var(--accent); border-color: var(--accent); }
.rgrid { display: grid; align-items: stretch; }

function TimeChart({ range, series, height = 168, unit = "", yMax, threshold, marks = [], dwell, fmt }) {

  const [hi, setHi] = useState(null);
  const R = RANGES[range], n = R.n, span = NOWH - R.a;
  const ts = useMemo(() => Array.from({ length: n }, (_, i) => R.a + (i / (n - 1)) * span), [range]);

  const flat = data.flat().filter((v) => v != null);
  const mx = yMax || niceMax(Math.max(1, ...flat));
  const P = { l: 40, r: 10, t: 10, b: 22 }, pw = Math.max(10, w - P.l - P.r), ph = height - P.t - P.b;
  const X = (t) => P.l + ((t - R.a) / span) * pw, Y = (v) => P.t + ph - (Math.min(v, mx) / mx) * ph;
  const f = fmt || ((v) => (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + unit);
  const pathOf = (vals) => { let d = "", pen = false; vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + X(ts[i]).toFixed(1) + " " + Y(v).toFixed(1); pen = true; }); return d; };
  const ticks = []; for (let t = Math.ceil(R.a / R.step) * R.step; t <= NOWH + 1e-6; t += R.step) ticks.push(t);
  const yt = [0, mx / 2, mx];
  const onMove = (e) => { const r = e.currentTarget.getBoundingClientRect(); const i = Math.round(((e.clientX - r.left - P.l) / pw) * (n - 1)); setHi(i >= 0 && i < n ? i : null); };
  const first = data[0];
  const areaD = first.every((v) => v != null) ? pathOf(first) + `L${X(ts[n - 1])} ${Y(0)}L${X(ts[0])} ${Y(0)}Z` : null;
  const gid = "ga" + series[0].name.replace(/\W/g, "");
  return html`<div ref=${ref} style=${{ position: "relative" }}>
    <svg width=${w} height=${height} onMouseMove=${onMove} onMouseLeave=${() => setHi(null)} style=${{ display: "block" }}>
      <defs><linearGradient id=${gid} x1="0" x2="0" y1="0" y2="1"><stop offset="0" style=${{ stopColor: series[0].c, stopOpacity: 0.16 }} /><stop offset="1" style=${{ stopColor: series[0].c, stopOpacity: 0 }} /></linearGradient></defs>
      ${yt.map((v) => html`<g key=${v}><line x1=${P.l} x2=${w - P.r} y1=${Y(v)} y2=${Y(v)} style=${{ stroke: "var(--grid)" }} />
        <text x=${P.l - 6} y=${Y(v) + 4} textAnchor="end" fontSize="10.5" style=${{ fill: "var(--text-3)", fontFamily: "var(--mono)" }}>${v >= 1000 ? (v / 1000).toFixed(1) + "k" : Math.round(v)}</text></g>`)}
      ${ticks.map((t) => html`<g key=${t}><line x1=${X(t)} x2=${X(t)} y1=${P.t} y2=${P.t + ph} style=${{ stroke: "var(--grid)" }} />
        <text x=${X(t)} y=${height - 6} textAnchor="middle" fontSize="10.5" style=${{ fill: "var(--text-3)", fontFamily: "var(--mono)" }}>${tickLabel(t, range)}</text></g>`)}
      ${dwell && dwell[1] > R.a ? html`<rect x=${X(Math.max(R.a, dwell[0]))} y=${P.t} width=${Math.max(0, X(dwell[1]) - X(Math.max(R.a, dwell[0])))} height=${ph} style=${{ fill: "var(--med)", opacity: 0.1 }} />` : null}
      ${threshold != null ? html`<g><line x1=${P.l} x2=${w - P.r} y1=${Y(threshold)} y2=${Y(threshold)} style=${{ stroke: "var(--crit)" }} strokeDasharray="4 3" />
        <text x=${w - P.r - 2} y=${Y(threshold) - 4} textAnchor="end" fontSize="10.5" style=${{ fill: "var(--crit)" }}>threshold ${threshold}${unit}</text></g>` : null}
      ${areaD ? html`<path d=${areaD} fill=${`url(#${gid})`} />` : null}
      ${data.map((vals, k) => html`<path key=${k} d=${pathOf(vals)} fill="none" style=${{ stroke: series[k].c }} strokeWidth="1.5" strokeLinejoin="round" />`)}
      ${marks.filter((m) => m.t >= R.a && m.t <= NOWH).map((m) => html`<g key=${m.label}>
        <line x1=${X(m.t)} x2=${X(m.t)} y1=${P.t} y2=${P.t + ph} style=${{ stroke: m.c }} strokeDasharray="2 3" />
        <rect x=${X(m.t) - 4} y=${P.t - 1} width="8" height="8" rx="1.5" transform=${`rotate(45 ${X(m.t)} ${P.t + 3})`} style=${{ fill: m.c }}><title>${m.label} · ${hhmm(m.t)}</title></rect>

// Event volume, stacked by kind, with drag-to-select.
function EventHistogram({ entries, range, height = 150, brush, onBrush }) {
  const ref = useRef(null), w = useWidth(ref);
  const R = RANGES[range], nb = R.bins, span = NOWH - R.a, bw = span / nb;
  const keys = Object.keys(KINDS);
  const bins = useMemo(() => { const b = Array.from({ length: nb }, () => Object.fromEntries(keys.map((k) => [k, 0])));
    entries.forEach((e) => { if (e.t < R.a) return; const i = Math.min(nb - 1, Math.floor((e.t - R.a) / bw)); b[i][e.kind] += 1; }); return b; }, [entries, range]);
  const tot = bins.map((b) => keys.reduce((s, k) => s + b[k], 0));
  const mx = niceMax(Math.max(4, ...tot));
  const P = { l: 34, r: 8, t: 8, b: 22 }, pw = w - P.l - P.r, ph = height - P.t - P.b, cw = pw / nb;
  const Y = (v) => P.t + ph - (v / mx) * ph;
  const [drag, setDrag] = useState(null); const [hov, setHov] = useState(null);
  const at = (e) => { const r = e.currentTarget.getBoundingClientRect(); return Math.max(0, Math.min(nb - 1, Math.floor((e.clientX - r.left - P.l) / cw))); };
  const ticks = []; for (let t = Math.ceil(R.a / R.step) * R.step; t <= NOWH + 1e-6; t += R.step) ticks.push(t);
  const sel = drag ? [Math.min(drag[0], drag[1]), Math.max(drag[0], drag[1])] : brush ? [Math.floor((brush[0] - R.a) / bw), Math.floor((brush[1] - R.a) / bw - 1e-6)] : null;
  return html`<div ref=${ref} style=${{ position: "relative", userSelect: "none" }}>
    <svg width=${w} height=${height} style=${{ display: "block", cursor: onBrush ? "crosshair" : "default" }}
      onMouseDown=${(e) => { if (onBrush) { const i = at(e); setDrag([i, i]); } }}
      onMouseMove=${(e) => { const i = at(e); setHov(i); if (drag) setDrag([drag[0], i]); }}
      onMouseLeave=${() => setHov(null)}
      onMouseUp=${() => { if (!drag) return; const [a, b] = [Math.min(...drag), Math.max(...drag)]; setDrag(null); if (a === b && brush) onBrush(null); else onBrush([R.a + a * bw, R.a + (b + 1) * bw]); }}>
      ${[0, mx / 2, mx].map((v) => html`<g key=${v}><line x1=${P.l} x2=${w - P.r} y1=${Y(v)} y2=${Y(v)} style=${{ stroke: "var(--grid)" }} />
        <text x=${P.l - 6} y=${Y(v) + 4} textAnchor="end" fontSize="10.5" style=${{ fill: "var(--text-3)", fontFamily: "var(--mono)" }}>${v}</text></g>`)}
      ${sel ? html`<rect x=${P.l + sel[0] * cw} y=${P.t} width=${(sel[1] - sel[0] + 1) * cw} height=${ph} style=${{ fill: "var(--accent-soft)", stroke: "var(--accent)" }} strokeWidth="1" />` : null}
      ${bins.map((b, i) => { let acc = 0; return html`<g key=${i}>${keys.map((k) => { if (!b[k]) return null; const y0 = Y(acc), y1 = Y(acc + b[k]); acc += b[k];
        return html`<rect key=${k} x=${P.l + i * cw + 0.5} y=${y1} width=${Math.max(1, cw - 1.5)} height=${Math.max(0.5, y0 - y1)} style=${{ fill: KINDS[k].c, opacity: hov == null || hov === i ? 1 : 0.55 }} />`; })}</g>`; })}
      ${ticks.map((t) => html`<text key=${t} x=${P.l + ((t - R.a) / span) * pw} y=${height - 6} textAnchor="middle" fontSize="10.5" style=${{ fill: "var(--text-3)", fontFamily: "var(--mono)" }}>${tickLabel(t, range)}</text>`)}
    </svg>
    ${hov != null && !drag ? html`<div className="tt" style=${{ left: Math.min(P.l + hov * cw + cw + 8, w - 190), top: 4 }}>
      <div className="h">${fmtT(R.a + hov * bw, range)} – ${hhmm(R.a + (hov + 1) * bw)}</div>
      ${keys.filter((k) => bins[hov][k]).map((k) => html`<div key=${k} className="row" style=${{ gap: 8, flexWrap: "nowrap" }}><span className="leg"><span><i className="sq" style=${{ "--c": KINDS[k].c }} /></span></span><span className="t2">${KINDS[k].w}</span><span className="sp" /><b className="mono">${bins[hov][k]}</b></div>`)}

function applyConfirmed(base, conf) {

  }));

// A custom action: the script is checked as you type, the same way the worker client checks it on arrival.
const PY_OK = ["os", "sys", "time", "datetime", "pathlib", "shutil", "json", "re", "glob", "tempfile", "hashlib", "logging", "subprocess", "ctypes", "winreg", "csv", "zipfile", "socket", "platform", "getpass"];
const PS_OK = ["Microsoft.PowerShell.Management", "Microsoft.PowerShell.Utility", "Microsoft.PowerShell.Security", "ScheduledTasks", "NetAdapter", "NetTCPIP", "SmbShare", "Storage"];
function checkScript(lang, src) {
  const bad = [], used = [];
  if (lang === "Python") {
    const re = /^\s*(?:import\s+([\w.]+(?:\s*,\s*[\w.]+)*)|from\s+([\w.]+)\s+import)/gm; let m;
    while ((m = re.exec(src))) { (m[1] ? m[1].split(",") : [m[2]]).map((x) => x.trim().split(".")[0]).forEach((x) => { used.push(x); if (!PY_OK.includes(x)) bad.push(x); }); }
    let depth = 0; for (const ch of src) { if ("([{".includes(ch)) depth++; if (")]}".includes(ch)) depth--; if (depth < 0) break; }
    return { compiles: depth === 0, used: [...new Set(used)], bad: [...new Set(bad)] };
  }
  const re = /Import-Module\s+([\w.\-]+)/gi; let m;
  while ((m = re.exec(src))) { used.push(m[1]); if (!PS_OK.includes(m[1])) bad.push(m[1]); }
  let depth = 0; for (const ch of src) { if (ch === "{") depth++; if (ch === "}") depth--; }
  return { compiles: depth === 0, used: [...new Set(used)], bad: [...new Set(bad)] };
}
