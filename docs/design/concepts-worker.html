<title>Falcon Concepts · Worker</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: the Admin concept's shell (sidebar of moments, page header); the person's screen across the width, and under it
   what the moment is and its numbered parts as picked cards. Sample content: Esi at LOG-01; Admins R. Mensah and A. Quaye. */
:root {
  color-scheme: light;
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #f8f9fb; --surface-3: #eef0f3;
  --border: #e2e5ea; --border-strong: #cdd2da;
  --text: #191d25; --text-2: #4a5160; --text-3: #737b8a; --text-4: #a6adb9;
  --accent: #2459d6; --accent-soft: rgba(36,89,214,0.09);
  --crit: #c8331f; --med: #b58105;
  --desk-a: #d5dce6; --desk-b: #e9edf2; --sk: #e3e7ed; --sk-2: #d3d9e2;
  --shadow-pop: 0 8px 24px -6px rgba(16,24,40,0.18), 0 2px 6px rgba(16,24,40,0.06);
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #0c0f14; --surface: #12161d; --surface-2: #161b23; --surface-3: #1d232d;
  --border: #232a35; --border-strong: #323b48;
  --text: #e4e7ed; --text-2: #aab1be; --text-3: #7c8595; --text-4: #555e6d;
  --accent: #5b8cff; --accent-soft: rgba(91,140,255,0.13);
  --crit: #f2604c; --med: #d9a93a;
  --desk-a: #1a222d; --desk-b: #131921; --sk: #252c37; --sk-2: #313a47;
  --shadow-pop: 0 10px 30px -6px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.4); } }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0f14; --surface: #12161d; --surface-2: #161b23; --surface-3: #1d232d;
  --border: #232a35; --border-strong: #323b48;
  --text: #e4e7ed; --text-2: #aab1be; --text-3: #7c8595; --text-4: #555e6d;
  --accent: #5b8cff; --accent-soft: rgba(91,140,255,0.13);
  --crit: #f2604c; --med: #d9a93a;
  --desk-a: #1a222d; --desk-b: #131921; --sk: #252c37; --sk-2: #313a47;
  --shadow-pop: 0 10px 30px -6px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.4); }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; color: inherit; }

/* --- shell, as the Admin concept */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 10px 8px; gap: 1px; box-sizing: border-box; }
.org { display: flex; align-items: center; gap: 9px; padding: 6px 8px 12px; }
.logo { width: 26px; height: 26px; border-radius: 5px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.org b { display: block; font-size: 13px; font-weight: 600; } .org span { display: block; font-size: 11.5px; color: var(--text-3); }
.grp { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-4); padding: 14px 10px 4px; }
.nav { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 5px; color: var(--text-2); cursor: pointer; user-select: none; }
.nav:hover { background: var(--surface-3); color: var(--text); }
.nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.nav svg { width: 15px; height: 15px; flex: none; }
.nav:focus-visible { outline: 2px solid var(--accent); }
.side-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--text-3); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 2px 8px; font-size: 11.5px; color: var(--text-3); }
.seg button.on { background: var(--surface-3); color: var(--text); }
main { min-width: 0; padding-block: 28px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; justify-content: center; gap: 16px; width: 100%; max-width: 1240px; min-height: 100vh; margin-inline: auto; box-sizing: border-box; }
.ph1 { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ph1 h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.ph1 .sub { color: var(--text-3); margin-top: 2px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 0 6px; height: 20px; border-radius: 3px;
  background: color-mix(in srgb, var(--c, var(--text-3)) 12%, transparent); color: var(--c, var(--text-2)); white-space: nowrap; font-weight: 500; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; min-width: 0; }
.phd { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.pt { font-weight: 600; font-size: 13px; }
.pt small { font-weight: 400; color: var(--text-3); font-size: 12px; margin-left: 8px; }
.pbd { padding: 14px; }
.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 20px; align-items: start; }

/* --- the parts, as Issues cards: a click picks */
.what { color: var(--text-2); margin: 0 0 12px; max-width: 60ch; }
.decide { display: flex; flex-direction: column; gap: 3px; padding: 9px 12px; border-radius: 10px; font-size: 12.5px;
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.decide b { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.k { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-4); margin: 0 0 6px; }
.iq-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.iq-card { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); cursor: pointer; }
.iq-card:hover { background: color-mix(in srgb, var(--surface-2) 50%, var(--surface-3)); }
.iq-card.on { background: var(--surface-3); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.iq-card:focus-visible { outline: 2px solid var(--accent); }
.iq-card .iq-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); font-weight: 600; font-size: 12px; }
.iq-card.on .iq-ic { background: var(--accent); color: #fff; }
.iq-card .tx { min-width: 0; }
.iq-card .tx b { display: block; font-size: 13px; font-weight: 600; }
.iq-card .tx span { display: block; font-size: 12px; color: var(--text-3); }

/* --- the desktop */
.desk { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: linear-gradient(155deg, var(--desk-a), var(--desk-b)); container-type: inline-size; }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 5.5%; background: color-mix(in srgb, var(--surface) 82%, transparent); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 1.6%; }
.taskbar .apps { display: flex; gap: .9cqw; } .taskbar .apps i { width: 1.9cqw; height: 1.9cqw; border-radius: .4cqw; background: var(--sk-2); }
.tray { display: flex; align-items: center; gap: 1.2cqw; font-size: 1.05cqw; color: var(--text-2); }
.ticon { position: relative; width: 2cqw; height: 2cqw; border-radius: .45cqw; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 1.05cqw; font-weight: 600; }
.ticon.off { background: var(--text-4); }
.ticon i { position: absolute; top: -.7cqw; right: -.8cqw; min-width: 1.4cqw; height: 1.4cqw; padding: 0 .3cqw; border-radius: 1cqw; background: var(--crit); color: #fff; font-size: .85cqw; font-style: normal; display: grid; place-items: center; box-sizing: border-box; }
.win { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: .8cqw; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; overflow: hidden; }
.win > .hd { flex: none; height: 2.8cqw; display: flex; align-items: center; justify-content: space-between; padding: 0 1.2cqw; font-size: 1cqw; color: var(--text-3); border-bottom: 1px solid var(--border); }
.win > .hd .dots { display: flex; gap: .7cqw; } .win > .hd .dots i { width: .8cqw; height: .8cqw; border-radius: 50%; background: var(--sk-2); }
.win > .bd { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .5cqw; padding: 1cqw 1.2cqw 1.2cqw; }
.win.work { opacity: .65; } .win.work.back { opacity: .4; }
.win.note { border-radius: 1cqw; }
.win.term { background: #12161c; border-color: #000; } .win.term > .hd { color: #9aa4b1; border-color: #262c35; }
.topbar { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
.cover { position: absolute; inset: 0; background: rgba(14, 18, 24, .93); display: flex; align-items: center; justify-content: center; color: #e9edf2; }
.cover.red { background: radial-gradient(circle at 50% 40%, rgba(120, 22, 14, .95), rgba(40, 8, 6, .97)); }
.cover .stack { width: 46%; display: flex; flex-direction: column; gap: 1cqw; }
/* an Admin inside: one calm, centred composition */
.cover.inuse { background: radial-gradient(circle at 50% 42%, rgba(30, 38, 52, .96), rgba(10, 13, 18, .97)); }
.inuse .stack { width: 40%; align-items: stretch; gap: 1.6cqw; text-align: center; }
.iu-who { display: flex; flex-direction: column; align-items: center; gap: .6cqw; }
.iu-av { width: 5.6cqw; height: 5.6cqw; border-radius: 50%; display: grid; place-items: center; font-size: 1.7cqw; font-weight: 600; color: #fff; background: rgba(91,140,255,.22); box-shadow: 0 0 0 .5cqw rgba(91,140,255,.08), 0 0 0 1px rgba(255,255,255,.12) inset; margin-bottom: .4cqw; }
.iu-eye { font-size: .95cqw; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.5); }
.iu-title { font-size: 1.75cqw; font-weight: 600; color: #fff; text-wrap: balance; }
.iu-time { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 1.4cqw; padding: 1.1cqw 1.6cqw; border-radius: 1cqw; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); }
.iu-time div:not(.iu-track) { display: flex; flex-direction: column; gap: .1cqw; }
.iu-time span { font-size: .9cqw; color: rgba(255,255,255,.5); }
.iu-time b { font-size: 1.5cqw; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
.iu-track { height: .5cqw; border-radius: .3cqw; background: rgba(255,255,255,.12); overflow: hidden; }
.iu-track i { display: block; height: 100%; border-radius: .3cqw; background: #8fb0ff; }
.iu-note { font-size: 1.1cqw; color: rgba(255,255,255,.62); }
.iu-lock svg { width: 2.4cqw; height: 2.4cqw; }
.cover.inuse.red { background: radial-gradient(circle at 50% 42%, rgba(120, 24, 16, .96), rgba(36, 8, 6, .97)); }
.iu-red { background: rgba(255, 120, 100, .2); box-shadow: 0 0 0 .5cqw rgba(255, 120, 100, .08), 0 0 0 1px rgba(255,255,255,.14) inset; }
.iu-eye-red { color: #ffb4a8; }
.iu-big { font-size: 2.3cqw; }
.iu-text { text-align: left; font-size: 1.3cqw; }
.iu-act { display: flex; flex-direction: column; align-items: center; gap: .8cqw; }
.iu-why { font-size: 1.2cqw; line-height: 1.5; color: rgba(255,255,255,.85); padding: 1cqw 1.6cqw; border-radius: 1cqw; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); }

/* a part: its number; picked shows on the desktop */
.rg { position: relative; flex: var(--f, 0 0 auto); min-height: 0; display: flex; flex-direction: column; gap: .5cqw; padding: .8cqw; border-radius: .6cqw; outline: 1px dashed transparent; cursor: pointer; transition: outline-color .15s, background .15s; }
.rg:hover { outline-color: var(--border-strong); }
.rg.on { outline: 2px solid var(--accent); background: var(--accent-soft); }
.rg .n { position: absolute; top: -.6cqw; left: -.6cqw; width: 1.6cqw; height: 1.6cqw; border-radius: 50%; background: var(--accent); color: #fff; font-size: .9cqw; font-weight: 600; display: grid; place-items: center; z-index: 2; box-shadow: 0 0 0 .2cqw var(--surface); opacity: .9; }
.rg.plain { cursor: default; outline: none; }

/* --- what is on the screen, in the desktop's own scale */
.sk { display: block; height: .8cqw; border-radius: .5cqw; background: var(--sk); }
.c-h1 { font-size: 1.75cqw; font-weight: 600; line-height: 1.25; color: var(--text); text-wrap: balance; }
.c-h2 { font-size: 1.25cqw; font-weight: 600; color: var(--text); line-height: 1.3; }
.c-p { font-size: 1.1cqw; color: var(--text-2); line-height: 1.5; }
.c-s { font-size: .95cqw; color: var(--text-3); line-height: 1.4; }
.c-warn { color: var(--med); } .c-acc { color: var(--accent); } .c-crit { color: var(--crit); }
.c-row { display: flex; align-items: center; gap: .9cqw; min-width: 0; } .c-row > .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .15cqw; }
.c-av { flex: none; width: 3cqw; height: 3cqw; border-radius: 50%; background: color-mix(in srgb, var(--accent) 16%, var(--surface-3)); color: var(--accent); font-size: 1.05cqw; font-weight: 600; display: grid; place-items: center; }
.c-logo { flex: none; width: 2.8cqw; height: 2.8cqw; border-radius: .6cqw; background: var(--accent); color: #fff; font-size: 1.4cqw; font-weight: 600; display: grid; place-items: center; }
.c-tabs { display: flex; gap: 1.8cqw; border-bottom: 1px solid var(--border); font-size: 1.1cqw; color: var(--text-3); }
.c-tabs span { padding-bottom: .6cqw; display: inline-flex; gap: .45cqw; align-items: center; }
.c-tabs span.on { color: var(--text); font-weight: 600; box-shadow: inset 0 -.2cqw 0 var(--accent); }
.c-tabs i { font-style: normal; font-size: .85cqw; font-weight: 600; background: var(--accent); color: #fff; border-radius: 1cqw; padding: 0 .45cqw; line-height: 1.4cqw; }
.c-card { border: 1px solid var(--border); border-radius: .8cqw; padding: 1cqw 1.2cqw; display: flex; flex-direction: column; gap: .3cqw; background: var(--surface); }
.c-card .c-row { align-items: flex-start; }
.c-card.dim { background: transparent; border-style: dashed; } .c-card.dim .c-h2 { color: var(--text-2); font-weight: 500; }
.c-cols { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1cqw; }
.c-cols > .rg { gap: .7cqw; }
.c-colh { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: .2cqw; }
.c-new { font-style: normal; font-size: .85cqw; font-weight: 600; background: var(--accent); color: #fff; border-radius: 1cqw; padding: .05cqw .55cqw; margin-left: .3cqw; vertical-align: .1cqw; }
.c-link.dis { opacity: .45; }
/* the task and message windows */
.tw-head { display: flex; align-items: center; gap: 1cqw; padding-bottom: .9cqw; border-bottom: 1px solid var(--border); } .tw-head .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tw-due { display: flex; flex-direction: column; align-items: flex-end; padding: .5cqw 1cqw; border-radius: .7cqw; background: color-mix(in srgb, var(--med) 12%, transparent); }
.tw-due span { font-size: .85cqw; color: var(--med); } .tw-due b { font-size: 1.15cqw; color: var(--med); font-weight: 600; }
.tw-box { display: flex; flex-direction: column; gap: .6cqw; padding: 1cqw 1.2cqw; border-radius: .8cqw; background: var(--surface-2); }
.tw-box .c-file { background: var(--surface); }
.tw-box-h { display: flex; justify-content: space-between; align-items: baseline; }
.tw-pill { font-size: .85cqw; padding: .1cqw .6cqw; border-radius: 1cqw; background: var(--surface-3); color: var(--text-3); white-space: nowrap; }
.tw-foot { display: flex; align-items: center; gap: 1cqw; padding-top: .9cqw; border-top: 1px solid var(--border); } .tw-foot .grow { flex: 1; }
.mw-earlier { display: flex; align-items: center; gap: .7cqw; font-size: .95cqw; color: var(--text-3); padding: .5cqw .8cqw; border-radius: .6cqw; background: var(--surface-2); }
.mw-earlier svg { width: 1.3cqw; height: 1.3cqw; flex: none; }
.mw-msg { font-size: 1.35cqw; line-height: 1.55; color: var(--text); padding: 1.2cqw 1.4cqw; border-radius: 1.2cqw; border-top-left-radius: .3cqw; background: var(--surface-3); align-self: flex-start; }
.mw-compose { display: flex; align-items: center; gap: .8cqw; padding: .5cqw .5cqw .5cqw 1.2cqw; border: 1px solid var(--border-strong); border-radius: 2cqw; font-size: 1.1cqw; background: var(--surface-2); }
.mw-compose .grow { flex: 1; } .mw-compose .grow::after { content: ""; display: inline-block; width: 1px; height: 1.3cqw; background: var(--accent); margin-left: .15cqw; vertical-align: -.2cqw; }
.mw-compose .btn { border-radius: 1.6cqw; }
.c-card.req { border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--border)); background: transparent; }
.c-card.sel { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); background: var(--accent-soft); }
.c-card > .grow { display: flex; flex-direction: column; gap: .3cqw; }
.c-away { display: flex; align-items: center; gap: .9cqw; padding: .7cqw 1cqw; border-radius: .7cqw; background: var(--surface-2); font-size: 1.05cqw; color: var(--text-2); }
.c-away svg { width: 1.5cqw; height: 1.5cqw; color: var(--text-3); flex: none; } .c-away .grow { flex: 1; }
.c-tag { display: inline-block; font-size: .85cqw; font-weight: 600; padding: .05cqw .55cqw; border-radius: .3cqw; background: var(--surface-3); color: var(--text-2); }
.c-tag.crit { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit); } .c-tag.warn { background: color-mix(in srgb, var(--med) 16%, transparent); color: var(--med); }
.c-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .8cqw 1.6cqw; font-size: 1.05cqw; } .c-facts span { color: var(--text-3); } .c-facts b { font-weight: 500; color: var(--text); }
.c-meter { display: block; height: .7cqw; border-radius: .4cqw; background: var(--surface-3); margin: .3cqw 0 .35cqw; overflow: hidden; } .c-meter i { display: block; height: 100%; background: color-mix(in srgb, var(--accent) 80%, var(--surface)); }
.c-facts .mono { font-family: var(--mono); font-size: .95cqw; }
.c-tl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .9cqw 1.6cqw; font-size: 1.05cqw; color: var(--text); align-items: baseline; }
.c-tl svg { width: 1.3cqw; height: 1.3cqw; color: var(--text-3); vertical-align: -.25cqw; margin-right: .6cqw; }
.stays { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; margin: 0 0 12px; padding: 9px 12px; border-radius: 8px; background: var(--surface-2); cursor: pointer; font-size: 12.5px; }
.stays:hover { background: var(--surface-3); } .stays:focus-visible { outline: 2px solid var(--accent); }
.stays span:nth-child(2) { flex: 1; color: var(--accent); font-weight: 500; }
.c-k2 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-4); }

// ---------- drawing
const $ = (id) => document.getElementById(id);
let picked = null, parts = [];
function region(r) {
  if (!r.b) return `<div class="rg plain" style="--f:${r.f || "0 0 auto"}">${r.h}</div>`;
  const n = parts.push(r);
  return `<div class="rg" data-n="${n}" style="--f:${r.f || "0 0 auto"}"><span class="n">${n}</span>${r.h}</div>`;
}
function win(w) {
  const hd = w.cls === "note" ? "" : `<div class="hd"><span>${w.title}</span><span class="dots"><i></i><i></i><i></i></span></div>`;
  return `<div class="win ${w.cls || ""}" style="left:${w.x}%;top:${w.y}%;width:${w.w}%;height:${w.h}%">${hd}<div class="bd">${w.regions.map((e) => e.cols ? `<div class="c-cols" style="${e.tpl ? `grid-template-columns:${e.tpl}` : ""}">${e.cols.map(region).join("")}</div>` : region(e)).join("")}</div></div>`;
}
function show(id) {
  const m = MOMENTS.find((x) => x.id === id) || MOMENTS[0];
  parts = []; picked = null;
  let trayN = 0;
  if (m.tray.part) trayN = parts.push(m.tray.part);
  let h = (m.wins || []).map(win).join("");
  if (m.bar) h += `<div class="topbar">${region(m.bar)}</div>`;
  if (m.cover) h += `<div class="cover${m.red ? " red" : ""}${m.coverCls ? " " + m.coverCls : ""}"><div class="stack">${m.cover.map(region).join("")}</div></div>`;
  if (!m.tray.hide) h += `<div class="taskbar"><span class="apps"><i></i><i></i><i></i></span><span class="tray">${trayN ? `<span class="rg" data-n="${trayN}" style="padding:.4cqw"><span class="n">${trayN}</span>` : ""}<span class="ticon${m.tray.off ? " off" : ""}">F${m.tray.n ? `<i>${m.tray.n}</i>` : ""}</span>${trayN ? "</span>" : ""}<span>${m.clock || "10:42"}</span></span></div>`;
  $("desk").innerHTML = h;
  $("h1").textContent = m.name;
  $("sub").textContent = `${m.kind} · ${m.when}`;
  $("kind").textContent = m.kind;
  $("when").textContent = m.when;
  $("what").textContent = m.what;
  $("stays").innerHTML = m.stays ? `<button class="stays" data-go="${m.stays[0]}"><span class="c-k2">Where it stays</span><span>Falcon program · ${m.stays[1]}</span><span aria-hidden="true">→</span></button>` : "";
  $("decide").innerHTML = m.decide ? `<div class="decide"><b>To decide</b><span>${m.decide}</span></div>` : "";
  $("partsK").textContent = `On the screen · ${parts.length} part${parts.length === 1 ? "" : "s"}`;
  $("parts").innerHTML = parts.map((r, i) => `<button class="iq-card" data-n="${i + 1}"><span class="iq-ic">${i + 1}</span><div class="tx"><b>${r.b}</b>${r.s ? `<span>${r.s}</span>` : ""}</div></button>`).join("");
  document.querySelectorAll("#nav .nav").forEach((b) => b.classList.toggle("on", b.dataset.id === m.id));
}
function pick(n) {
  picked = picked === n ? null : n;
  document.querySelectorAll("[data-n]").forEach((el) => el.classList.toggle("on", el.dataset.n === picked));
}
$("nav").innerHTML = MOMENTS.map((m) => `${m.group ? `<div class="grp">${m.group}</div>` : ""}<button class="nav" data-id="${m.id}">${svg(m.icon)}<span>${m.name}</span></button>`).join("");
$("nav").addEventListener("click", (e) => { const b = e.target.closest(".nav"); if (b) location.hash = b.dataset.id; });
document.querySelector("main").addEventListener("click", (e) => { const g = e.target.closest("[data-go]"); if (g) { location.hash = g.dataset.go; return; } const el = e.target.closest("[data-n]"); if (el) pick(el.dataset.n); });
const route = () => show(location.hash.slice(1));
window.addEventListener("hashchange", route);
route();

// theme: per viewer, remembered when the browser allows it
function setTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll("#theme button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  try { localStorage.setItem("falcon-worker-theme", t); } catch (e) {}
}
let saved = ""; try { saved = localStorage.getItem("falcon-worker-theme") || ""; } catch (e) {}
setTheme(saved);
$("theme").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setTheme(b.dataset.t); });
</script>
