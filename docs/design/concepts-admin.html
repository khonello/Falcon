<style>
/* Layout: an operations console. Fixed sider, sticky top bar with the global time range, a 12-column
   content grid of hairline panels. Dense 13px type, tabular figures, one accent, severity hues only. */
:root {
  color-scheme: light;
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #f8f9fb; --surface-3: #eef0f3;
  --border: #e2e5ea; --border-strong: #cdd2da; --grid: #eef0f3;
  --text: #191d25; --text-2: #4a5160; --text-3: #737b8a; --text-4: #a6adb9;
  --accent: #2459d6; --accent-soft: rgba(36,89,214,0.09);
  --crit: #c8331f; --high: #d4610f; --med: #b58105; --low: #5b6b85; --ok: #1d8a4f;
  --s1: #2459d6; --s2: #0f8f8a; --s3: #7357d9; --s4: #d4610f; --s5: #b58105; --s6: #8a94a6;
  --own: #c9ced7;
  --shadow-pop: 0 8px 24px -6px rgba(16,24,40,0.18), 0 2px 6px rgba(16,24,40,0.06);
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c0f14; --surface: #12161d; --surface-2: #161b23; --surface-3: #1d232d;
    --border: #232a35; --border-strong: #323b48; --grid: #1c222b;
    --text: #e4e7ed; --text-2: #aab1be; --text-3: #7c8595; --text-4: #555e6d;
    --accent: #5b8cff; --accent-soft: rgba(91,140,255,0.13);
    --crit: #f2604c; --high: #f08a3e; --med: #d9a93a; --low: #8796b0; --ok: #3fb877;
    --s1: #5b8cff; --s2: #2bb8b1; --s3: #9a85f2; --s4: #f08a3e; --s5: #d9a93a; --s6: #7d889b;
    --own: #3a4352;
    --shadow-pop: 0 10px 30px -6px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0f14; --surface: #12161d; --surface-2: #161b23; --surface-3: #1d232d;
  --border: #232a35; --border-strong: #323b48; --grid: #1c222b;
  --text: #e4e7ed; --text-2: #aab1be; --text-3: #7c8595; --text-4: #555e6d;
  --accent: #5b8cff; --accent-soft: rgba(91,140,255,0.13);
  --crit: #f2604c; --high: #f08a3e; --med: #d9a93a; --low: #8796b0; --ok: #3fb877;
  --s1: #5b8cff; --s2: #2bb8b1; --s3: #9a85f2; --s4: #f08a3e; --s5: #d9a93a; --s6: #7d889b;
  --own: #3a4352;
  --shadow-pop: 0 10px 30px -6px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; line-height: 1.5;
       font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.t2 { color: var(--text-2); }
.t3 { color: var(--text-3); }
.t4 { color: var(--text-4); }
.b { font-weight: 600; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--surface); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; padding: 10px 8px; gap: 1px; }
.org { display: flex; align-items: center; gap: 9px; padding: 6px 8px 12px; }

.grp { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-4); padding: 14px 10px 4px; }

.nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

.nav .cnt.hot { color: var(--crit); font-weight: 500; }
/* unanswered pings: bright, bold, pulsing, until everything is answered (resource-assistance-combo.md, Ping) */
.nav .cnt.pulse { color: #fff; background: var(--crit); border-radius: 9px; padding: 0 6px; font-weight: 600; animation: falcon-pulse 1.6s ease-in-out infinite; }

}

.side-foot > span { white-space: nowrap; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; min-height: 50px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 540px) minmax(0, 1fr); align-items: center; column-gap: 12px;
       padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.top-r { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 0; }

.crumb b, .crumb a { overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--text); font-weight: 600; font-size: 14px; }
.search { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; min-width: 0; border: 1px solid var(--border);
          border-radius: 5px; color: var(--text-3); background: var(--surface-2); cursor: pointer; }
.kbd { font-family: var(--mono); font-size: 11px; padding: 0 5px; border: 1px solid var(--border-strong); border-radius: 3px; color: var(--text-3); margin-left: auto; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
/* the page sits in the middle of the area beside the menu, with room either side on a wide screen, in line with the centred search bar */
.content { padding: 18px 20px 48px; display: flex; flex-direction: column; gap: 14px; }
.ph1 { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ph1 h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; min-width: 0; }

.pbd { padding: 14px; }

.g { display: grid; gap: 14px; }
.c-84 { grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); }
.c-66 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sp { flex: 1; }
.sev { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sev i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }

       background: color-mix(in srgb, var(--c, var(--text-3)) 12%, transparent); color: var(--c, var(--text-2)); white-space: nowrap; font-weight: 500; }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: visible; }
.bar > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--c, var(--s1)); }
.bar > em { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--text-3); }
.tt { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 5px;
      box-shadow: var(--shadow-pop); padding: 7px 9px; font-size: 12px; white-space: nowrap; z-index: 10; }
.tt .h { color: var(--text-3); margin-bottom: 4px; font-family: var(--mono); font-size: 11.5px; }
.leg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); }
.leg span { display: inline-flex; align-items: center; gap: 6px; }
.leg i { width: 10px; height: 3px; border-radius: 2px; background: var(--c); display: inline-block; }
.leg i.sq { height: 10px; width: 10px; border-radius: 2px; }
.stream { display: flex; flex-direction: column; max-height: 316px; overflow: auto; }
.ev { display: grid; grid-template-columns: 62px 10px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 6px 14px; border-bottom: 1px solid var(--grid); }
.ev > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev.new { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 20px; }
.meta .k { color: var(--text-3); font-size: 12px; }

.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.kv.chk { grid-template-columns: 18px minmax(0, 1fr) auto; }
.src { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; white-space: nowrap; cursor: default; }
.src i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.wizard { max-width: 980px; width: 100%; margin: 0 auto; }
.choice { flex: 1 1 220px; min-width: 0; border: 1px solid var(--border); border-radius: 6px; padding: 16px; cursor: pointer; background: var(--surface); transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--border-strong); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); }
.choice .ci { width: 28px; height: 28px; border-radius: 5px; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); flex: none; }
.choice.on .ci { background: var(--accent); color: #fff; }
.reveal { animation: reveal .35s cubic-bezier(.2,.8,.2,1); }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } }
.hl-wrap { position: relative; }
.hl-bg { position: absolute; inset: 0; background: var(--surface); border-radius: 4px; }
.hl-mirror, .hl-ta { font-family: var(--sans); font-size: 13.5px; line-height: 1.7; padding: 8px 11px; border: 1px solid transparent; white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; letter-spacing: normal; }
.hl-mirror { position: absolute; inset: 0; color: transparent; pointer-events: none; overflow: hidden; }

.hl-ta:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.hl-ta::placeholder { color: var(--text-4); }
.hl { border-radius: 2px; box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--c) 55%, transparent); background-image: none; }
.hl:not(.ok):not(.ig) { box-shadow: none; background: linear-gradient(to right, var(--c) 50%, transparent 50%) left bottom / 4px 1.5px repeat-x; }
.hl.ok { background: color-mix(in srgb, var(--c) 18%, transparent); box-shadow: inset 0 -2px 0 var(--c); }
.hl.ig { box-shadow: none; }
.pick { position: absolute; z-index: 5; width: 310px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; box-shadow: var(--shadow-pop); padding: 6px; }
.pick-i { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 4px; cursor: pointer; color: var(--text); font: inherit; }
.pick-i:hover, .pick-i:focus-visible, .pick-i.on { background: var(--accent-soft); outline: none; }
.fchip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
.fchip i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); display: inline-block; }
.fchip:hover { border-color: var(--border-strong); }
.nt-h { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }

}

.ts .tk-facts > span > span:last-child { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ts-h { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.ts-list { display: flex; flex-direction: column; }

.nt-with { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; }

.orgtxt { min-width: 0; }
.orgtxt > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav.big { padding: 10px 12px; font-size: 14px; }

.mtree .ant-tree-treenode { width: 100%; }

/* the accordion standard (the user, 1 Nov 2026): a click on a card picks it, only Expand opens it; a section the pick
   changed pulses its border once, so the eye finds what changed. Once only: a pulse that keeps going means "unanswered" */
.pulsed { animation: sec-pulse 1.2s ease-out; }
.pz-wrap { border-radius: 6px; min-width: 0; }
/* loading in place: the section keeps its size, its content waits behind one line (the first child is its heading) */
.ld-on { position: relative; }
.ld-on > :not(:first-child):not(.ld-over) { visibility: hidden; }
.ld-over { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-3); font-size: 12.5px; }
.iq-card.pulsed, .auo-li.pulsed, .ms-p.pulsed { animation: item-pulse 1.2s ease-out; }
@keyframes item-pulse { 0%, 35% { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent), 0 0 0 4px color-mix(in srgb, var(--accent) 9%, transparent); }
  100% { box-shadow: 0 0 0 1.5px transparent, 0 0 0 6px transparent; } }

          ["HR", [["Payroll", ["salaries.csv", "overtime-sep.csv", "pension.xlsx"]], ["Reviews", ["reviews-2026.docx", "reviews-2025.docx"]], ["Contracts", ["staff-contract-template.docx", "nda-template.docx"]]]],

    const own = marked.find((k) => k.path === path), under = marked.find((k) => k.kind === "folder" && k.path !== path && path.startsWith(k.path));

    for (let d = 0; d < 14 && out.length < 3; d++) { const t = d * 24 + hh + mm / 60; if (t > NOWH && days.includes(dayOf(t))) out.push(t); } return out; }, [kind, at, days.join()]);
  const hist = kind === "Threshold" ? bt.per : kind === "Event" ? eh.per : [0, 1, 2, 3, 4, 5, 6].map((d) => (days.includes(dayOf((d - 6) * 24 + 12)) ? 1 : 0));
  const total = hist.reduce((a, b) => a + b, 0);
  const runsPerWeek = total * acts.length * (kind === "Schedule" ? targets.length : 1);
  const load = (id) => { setBase(id); setSt(id === "blank" ? { ...START.blank } : { ...stateFrom(id), name: `Copy of ${RBY[id].name}` }); };
  const note = (txt, warn) => html`<div style=${{ padding: "9px 12px", borderRadius: 5, fontSize: 12.5, background: warn ? "color-mix(in srgb, var(--med) 10%, transparent)" : "var(--surface-2)", color: warn ? "var(--med)" : "var(--text-2)" }}>${txt}</div>`;
  // Same page shape as New flow, without the boxes (user, 20 Oct 2026): one full-width panel, three columns in the order it
  // reads (When, On, Do) divided by hairlines, plain choices and plain rows, then the name and the checks, Save at the bottom.
  const lab = (t, c) => html`<div><div className="t3" style=${{ fontSize: 12, marginBottom: 4 }}>${t}</div><div className="row" style=${{ gap: 8 }}>${c}</div></div>`;
  const num = (i) => html`<span className="mono" style=${{ width: 22, height: 22, borderRadius: 4, background: "var(--surface-3)", display: "grid", placeItems: "center", fontSize: 12, flex: "none" }}>${i + 1}</span>`;
  const many = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const startSel = editing ? null : html`<${Select} size="small" allowClear showSearch placeholder="Start from a copy of a rule" style=${{ width: 230 }} value=${base === "blank" ? undefined : base} options=${RULES.map((r) => ({ value: r.id, label: "Copy of " + r.name }))} onChange=${(v) => load(v || "blank")} />`;
  // a choice is a tab: an icon and two words with a line under the picked one; only the picked one says more
  const tabsRow = (opts, cur, onPick) => html`<div role="tablist" style=${{ display: "flex", justifyContent: "center", gap: 22, borderBottom: "1px solid var(--border)" }}>${opts.map(([v, label, icon]) => html`<button key=${v} type="button" role="tab" aria-selected=${cur === v} className="tabbtn" onClick=${() => onPick(v)} style=${{ cursor: "pointer", display: "flex", alignItems: "center", gap: 6, padding: "4px 0 9px", marginBottom: -1, fontWeight: cur === v ? 600 : 500, color: cur === v ? "var(--text)" : "var(--text-3)", borderBottom: "2px solid " + (cur === v ? "var(--accent)" : "transparent") }}>${ic(icon)}${label}</button>`)}</div>`;
  const whenDesc = { Event: "A device is plugged in, a file appears, someone signs in. Reported the moment it happens.", Threshold: "CPU, memory, disk or network stays above a level for a while. Checked every 30 seconds.", Schedule: "At a time on chosen days, by the Engine's clock." };
  const onDesc = { all: `All ${MACHINES.length} machines you manage, and any registered later.`, pick: "A fixed list. New machines are not added." };
  const dayTxt = days.length === 7 ? "every day" : days.length === 5 && !days.includes("Sat") && !days.includes("Sun") ? "on weekdays" : days.join(", ") || "no day yet";
  // the three steps, in the order they read: a filled mark when the step is complete, an amber ring and what is missing when it is not
  const sums = [kind === "Event" ? ev : kind === "Threshold" ? `${mtr} above ${val}${unit}, for ${many(mins, "minute")}` : `At ${at}, ${dayTxt}`,
    scope === "all" ? `Every machine · ${targets.length}` : `${many(targets.length, "machine")} picked`,
    acts.length ? acts.map(stepLabel).join(", then ") : "Nothing yet"];
  const stepHead = html`<div style=${{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", borderBottom: "1px solid var(--border)", background: "var(--surface-2)" }}>
    ${["When", "On", "Do"].map((t, i) => { const bad = !!stepProblem[i];
      return html`<div key=${t} style=${{ minWidth: 0, display: "flex", alignItems: "center", gap: 12, padding: "13px 18px", borderLeft: i ? "1px solid var(--border)" : "none" }}>
        <span style=${{ width: 32, height: 32, borderRadius: 16, flex: "none", display: "grid", placeItems: "center", fontWeight: 600, fontSize: 14, background: bad ? "transparent" : "var(--accent)", color: bad ? "var(--med)" : "#fff", border: "2px solid " + (bad ? "var(--med)" : "var(--accent)") }}>${bad ? i + 1 : ic("CheckOutlined")}</span>
        <div style=${{ minWidth: 0, flex: 1 }}><div style=${{ fontWeight: 600, fontSize: 14.5 }}>${t}</div><div className=${"cut " + (bad ? "" : "t3")} style=${{ fontSize: 12.5, color: bad ? "var(--med)" : undefined }} title=${bad ? stepProblem[i] : sums[i]}>${bad ? stepProblem[i] : sums[i]}</div></div>
        ${i < 2 ? html`<span className="t4" style=${{ flex: "none" }}>${ic("ArrowRightOutlined")}</span>` : null}</div>`; })}</div>`;
  const fields = (kids) => html`<div style=${{ display: "flex", flexDirection: "column", gap: 10, marginTop: 10 }}>${kids}</div>`;
  const whenBody = html`<div>
      ${tabsRow([["Event", "An event", "ThunderboltOutlined"], ["Threshold", "A reading", "LineChartOutlined"], ["Schedule", "A schedule", "ClockCircleOutlined"]], kind, (v) => set("kind")(v))}
      <div className="t3" style=${{ fontSize: 12.5, marginTop: 10 }}>${kind ? whenDesc[kind] : "Pick what should start this rule."}</div>
      ${kind === "Event" ? fields(lab("Event", html`<${Select} id="nr-event" value=${ev || undefined} placeholder="Pick an event" onChange=${set("ev")} style=${{ width: "100%", maxWidth: 330 }} options=${EVENTS.map((x) => ({ value: x, label: x }))} />`)) : null}
      ${kind === "Threshold" ? fields(html`<${React.Fragment}>
        ${lab("Reading", html`<${Select} id="nr-metric" value=${mtr} onChange=${set("mtr")} style=${{ width: 92 }} options=${["CPU", "Memory", "Disk", "Network"].map((x) => ({ value: x, label: x }))} /><span className="t2">above</span><${InputNumber} id="nr-value" min=${1} max=${mtr === "Network" ? 100000 : 100} value=${val} onChange=${(v) => set("val")(v || 0)} style=${{ width: 62 }} /><span className="t2">${unit}</span><span className="t2">for</span><${InputNumber} id="nr-mins" min=${0} max=${120} value=${mins} onChange=${(v) => set("mins")(v || 0)} style=${{ width: 56 }} /><span className="t2">min</span>`)}
        <div className="t3" style=${{ fontSize: 12 }}>A short spike does not fire it: the reading has to stay above the line for that long.</div><//>`) : null}
      ${kind === "Schedule" ? fields(html`<${React.Fragment}>
        ${lab("Days", html`<${Checkbox.Group} value=${days} onChange=${set("days")} options=${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]} />`)}
        ${lab("At", html`<${Select} id="nr-at" value=${at} onChange=${set("at")} style=${{ width: 120 }} options=${Array.from({ length: 48 }, (_, i) => { const v = String(Math.floor(i / 2)).padStart(2, "0") + ":" + (i % 2 ? "30" : "00"); return { value: v, label: v }; })} />`)}<//>`) : null}
    </div>`;
  const onBody = html`<div>
      ${tabsRow([["all", "Every machine", "GlobalOutlined"], ["pick", "Pick machines", "DesktopOutlined"]], scope, (v) => set("scope")(v))}
      <div className="t3" style=${{ fontSize: 12.5, marginTop: 10 }}>${scope ? onDesc[scope] : "Choose which machines it watches."}</div>
      ${fields(html`<${React.Fragment}>
        ${scope === "pick" ? lab("Machines", html`<${Select} id="nr-hosts" mode="multiple" maxTagCount="responsive" value=${hosts} onChange=${set("hosts")} style=${{ width: "100%" }} options=${MACHINES.map((m) => ({ value: m.host, label: `${m.host} · ${m.user || "no user"}` }))} placeholder="Pick machines" />`) : null}
        ${targets.some((m) => m.status === "offline") ? note("LOG-02 is offline. The rule applies to it when it comes back.") : null}<//>`)}
    </div>`;
  const actRow = (x, i) => { const L = ABY[x.id];
    return html`<div key=${i} style=${{ padding: "10px 0", borderTop: i ? "1px solid var(--grid)" : "none" }}>
      <div className="row" style=${{ flexWrap: "wrap", gap: 4, alignItems: "flex-end" }}>
        ${num(i)}
        <${Select} value=${x.id} showSearch optionFilterProp="label" style=${{ flex: "1 1 130px", minWidth: 0 }} aria-label=${"Action " + (i + 1)}
          options=${["Control", "Monitoring", "Custom"].map((c) => ({ label: c, title: c, options: ACTION_LIB.filter((a) => a.cat === c).map((a) => ({ value: a.id, label: a.name })) }))}
          onChange=${(v) => updAct(i, { id: v, t: ABY[v].limit, person: v === "notify" ? "the Admin" : undefined, msg: undefined })} />
        <div style=${{ flex: "none" }}><div className="t3" style=${{ fontSize: 11, marginBottom: 2 }}>Time limit</div><div className="row" style=${{ flexWrap: "nowrap", gap: 4 }}><${InputNumber} min=${1} max=${3600} value=${x.t} onChange=${(v) => updAct(i, { t: v || 1 })} style=${{ width: 62 }} aria-label="Time limit in seconds" /><span className="t3" style=${{ fontSize: 12 }}>s</span></div></div>
        <${Button} size="small" type="text" icon=${ic("ArrowUpOutlined")} disabled=${i === 0} aria-label="Move up" onClick=${() => { const n = acts.slice(); [n[i - 1], n[i]] = [n[i], n[i - 1]]; set("acts")(n); }} />
        <${Button} size="small" type="text" icon=${ic("CloseOutlined")} aria-label="Remove" onClick=${() => set("acts")(acts.filter((_, j) => j !== i))} />
      </div>
      <div style=${{ marginLeft: 28 }}>
        ${x.id === "notify" ? html`<div style=${{ marginTop: 8 }}><${Select} value=${x.person} style=${{ width: "100%", maxWidth: 240 }} aria-label="Who to notify" options=${NOTIFY_WHO.map((w) => ({ value: w, label: w }))} onChange=${(v) => updAct(i, { person: v })} /></div>` : null}
        ${x.id === "msg" ? html`<div style=${{ marginTop: 8 }}><${Input} value=${x.msg || ""} onChange=${(e) => updAct(i, { msg: e.target.value })} placeholder="The message people will see" /></div>` : null}
        <div className="t3" style=${{ fontSize: 12, marginTop: 4 }}>${L.cat}${L.lang ? " · " + L.lang : ""} · ${L.desc}</div>
      </div></div>`; };
  const doBody = html`<div>${acts.length ? acts.map(actRow) : html`<div className="t3" style=${{ padding: "8px 0" }}>No actions yet. Add one.</div>`}
      <div style=${{ borderTop: "1px solid var(--border)", marginTop: 6, paddingTop: 12 }}><${Button} type="dashed" block icon=${ic("PlusOutlined")} onClick=${() => set("acts")([...acts, { id: "shot", t: ABY.shot.limit }])}>Add an action<//></div>
      <div style=${{ borderTop: "1px solid var(--grid)", marginTop: 12, paddingTop: 12 }}><${Checkbox} checked=${idle} onChange=${(e) => set("idle")(e.target.checked)}>Only run while the machine is idle<//></div>
      ${custom ? html`<div style=${{ marginTop: 10 }}>${note("Custom scripts run without a sandbox. The script is checked before it is sent and again on arrival, and every run is recorded.", true)}</div>` : null}
    </div>`;
  // The room under each column goes to a live look at what you are setting, always at the foot of the column so the three line up
  const cap = (t, right) => html`<div className="row" style=${{ justifyContent: "space-between", flexWrap: "nowrap" }}><span className="t3" style=${{ fontSize: 11, letterSpacing: 0.66, fontWeight: 600 }}>${t}</span>${right ? html`<span className="t3" style=${{ fontSize: 12 }}>${right}</span>` : null}</div>`;
  const mx = Math.max(1, ...hist);
  const whenLook = !kind
    ? html`<div>${cap("LAST 7 DAYS")}<div className="t3" style=${{ fontSize: 12.5, marginTop: 8 }}>Pick what should start this rule to see how often it would have fired.</div></div>`
    : kind === "Schedule"
    ? html`<div>${cap("NEXT RUNS", "by the Engine's clock")}<div style=${{ display: "flex", flexDirection: "column", gap: 2, marginTop: 8 }}>${nextRuns.length ? nextRuns.map((t) => html`<div key=${t} className="row" style=${{ padding: "5px 0", borderBottom: "1px solid var(--grid)", gap: 10 }}><span className="mono" style=${{ fontSize: 12.5 }}>${t < 24 ? "Today" : t < 48 ? "Tomorrow" : dayOf(t)}</span><span className="sp" /><span className="mono t2" style=${{ fontSize: 12.5 }}>${hhmm(t)}</span></div>`) : html`<span style=${{ color: "var(--med)", fontSize: 12.5 }}>Pick at least one day.</span>`}</div></div>`
    : html`<div>${cap("LAST 7 DAYS", "if it had been on")}
        <div className="row" style=${{ alignItems: "baseline", gap: 6, marginTop: 6 }}><span style=${{ fontSize: 28, fontWeight: 600, color: total > 40 ? "var(--med)" : "var(--text)" }}>${total}</span><span className="t2">time${total === 1 ? "" : "s"} it would have fired</span></div>
        <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 6, alignItems: "end", height: 56, marginTop: 10 }}>${hist.map((v, d) => html`<div key=${d} title=${`${v} on ${dayOf((d - 6) * 24 + 12)}`} style=${{ height: Math.max(3, Math.round((v / mx) * 52)), borderRadius: 3, background: v ? KINDC[kind] : "var(--surface-3)", opacity: v ? 1 : 0.8 }} />`)}</div>
        <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 6, marginTop: 4 }}>${hist.map((v, d) => html`<span key=${d} className="t3" style=${{ fontSize: 10.5, textAlign: "center", fontWeight: d === 6 ? 600 : 400 }}>${d === 6 ? "Today" : dayOf((d - 6) * 24 + 12).slice(0, 2)}</span>`)}</div>
        ${kind === "Threshold" && Object.keys(bt.where).length ? html`<div className="t3" style=${{ fontSize: 12, marginTop: 8 }}>Mostly on ${Object.entries(bt.where).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([h, n]) => `${h} (${n})`).join(", ")}</div>` : null}</div>`;
  const onLook = html`<div>${cap("MACHINES", many(targets.length, "machine"))}
      <div style=${{ maxHeight: 184, overflowY: "auto", marginTop: 6 }}>${targets.length ? targets.map((m) => html`<div key=${m.host} className="row" style=${{ gap: 10, flexWrap: "nowrap", padding: "5px 0", borderBottom: "1px solid var(--grid)" }}><i style=${{ width: 8, height: 8, borderRadius: 4, background: STATUS[m.status].c, flex: "none" }} /><span className="mono" style=${{ fontSize: 12.5 }}>${m.host}</span><span className="t3 cut" style=${{ fontSize: 12, minWidth: 0 }}>${m.user || "no one signed in"}</span><span className="sp" /><span className="t3" style=${{ fontSize: 11.5, flex: "none" }}>${STATUS[m.status].w}</span></div>`) : html`<span className="t3" style=${{ fontSize: 12.5 }}>None yet.</span>`}</div></div>`;
  const doLook = html`<div>${cap("WHAT IT WILL DO", acts.length ? many(acts.length * (kind === "Schedule" ? targets.length : 1), "action run") + " per firing" : null)}
      <div style=${{ display: "flex", flexDirection: "column", marginTop: 6 }}>${acts.length ? acts.map((x, i) => { const L = ABY[x.id];
        return html`<div key=${i} style=${{ padding: "6px 0", borderBottom: "1px solid var(--grid)" }}><div style=${{ fontWeight: 500, fontSize: 12.5 }}>${stepLabel(x)}</div><div className="t3" style=${{ fontSize: 12 }}>${typeof L.impact === "function" ? L.impact(targets.length) : L.desc}</div></div>`; }) : html`<span className="t3" style=${{ fontSize: 12.5 }}>Nothing yet.</span>`}</div>
      ${acts.length ? html`<div className="t3" style=${{ fontSize: 12, marginTop: 8 }}>Longest time limit ${Math.max(...acts.map((x) => x.t))}s${idle ? " · only while the machine is idle" : ""}</div>` : null}</div>`;
  const nameField = html`<${Field} label="Name"><${Input} id="nr-name" value=${name} onChange=${(e) => set("name")(e.target.value)} placeholder=${!kind ? "Name this rule" : kind === "Threshold" ? `High ${mtr.toLowerCase()} on ${scope === "dept" ? DBY[dept].name : "machines"}` : kind === "Event" ? ev.replace(/^A |^The /, "") : "Scheduled maintenance"} style=${{ maxWidth: 440 }} /><//>`;
  const bar = html`<div className="edbar"><span style=${{ fontSize: 12.5, color: problems.length ? "var(--med)" : "var(--text-3)", minWidth: 0 }}>${problems[0] || (editing ? "Changes apply from the next firing. The record keeps the old version." : "Saved rules are enabled straight away.")}</span><span className="sp" />
      <${Button} onClick=${cancel}>Cancel<//>
      <${Button} disabled=${problems.length > 0} onClick=${() => toast("Ran once on " + (th[0] || "a machine") + " (concept)")}>Test on one machine<//>
      <${Button} type="primary" disabled=${problems.length > 0} onClick=${() => { toast(editing ? "Changes saved (concept)" : "Rule saved and enabled (concept)"); go("automation", from || undefined); }}>${editing ? "Save changes" : "Save rule"}<//></div>`;
  return html`<${React.Fragment}>${modalCtx}<div style=${{ display: "flex", flexDirection: "column", gap: 14 }}>
    <${Panel} flush title=${editing ? `Editing ${RBY[from].name}` : "The rule"} sub=${editing ? "it keeps running as it was until you save" : "what starts it, where it runs and what it does"} extra=${startSel}>
      ${stepHead}
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))" }}>
        ${[[whenBody, whenLook], [onBody, onLook], [doBody, doLook]].map(([b, lk], i) => html`<div key=${i} style=${{ minWidth: 0, minHeight: 470, padding: "16px 18px 20px", display: "flex", flexDirection: "column", borderLeft: i ? "1px solid var(--border)" : "none" }}>${b}<div style=${{ marginTop: "auto", paddingTop: 14, borderTop: "1px solid var(--grid)", height: 240, overflowY: "auto" }}>${lk}</div></div>`)}
      </div>
    <//>
    <${Panel} title="Name it and check it" sub="what it would have done last week, replayed against real data">
      ${nameField}
      <div style=${{ margin: "18px 0", padding: "14px 16px", borderRadius: 6, background: "var(--surface-2)", fontSize: 15, lineHeight: 1.6 }}>
        <span className="t3">When</span> ${whenTxt} <span className="t3">on</span> ${whereTxt}<span className="t3">, do</span> ${acts.length ? acts.map(stepLabel).join(", then ") : html`<span style=${{ color: "var(--med)" }}>nothing yet</span>`}${idle ? html`<span className="t3">, only while idle</span>` : null}.
      </div>
      <div className="g c-66" style=${{ gap: 28 }}>
        <div>
          <div className="b" style=${{ marginBottom: 2 }}>${kind === "Schedule" ? "When it will run" : "If it had been on last week"}</div>
          <div className="t3" style=${{ fontSize: 12, marginBottom: 10 }}>${!kind ? "Pick what should start the rule to see this." : kind === "Threshold" ? "Replayed against 7 days of real readings" : kind === "Event" ? eh.note : "The next three runs"}</div>
          ${!kind ? null : kind === "Schedule"
            ? html`<div style=${{ display: "flex", flexDirection: "column", gap: 6 }}>${nextRuns.length ? nextRuns.map((t) => html`<div key=${t} className="mono">${t < 24 ? "Today" : t < 48 ? "Tomorrow" : dayOf(t)} ${hhmm(t)}</div>`) : html`<span style=${{ color: "var(--med)" }}>Pick at least one day.</span>`}</div>`
            : html`<div className="row" style=${{ alignItems: "baseline", gap: 6 }}><span style=${{ fontSize: 28, fontWeight: 600, color: total > 40 ? "var(--med)" : "var(--text)" }}>${total}</span><span className="t2">time${total === 1 ? "" : "s"} it would have fired</span></div>
              <${DayBars} series=${[{ name: "Would have fired", c: KINDC[kind], v: hist }]} height=${120} />
              ${kind === "Threshold" && Object.keys(bt.where).length ? html`<div className="t3" style=${{ fontSize: 12 }}>On ${Object.entries(bt.where).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([h, n]) => `${h} (${n})`).join(", ")}</div>` : null}`}
        </div>
        <div style=${{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div className="meta" style=${{ gridTemplateColumns: "1fr 1fr" }}>
            ${[["Machines", String(targets.length)], ["Actions per firing", String(acts.length * (kind === "Schedule" ? targets.length : 1))], ["Action runs a week", kind === "Schedule" ? String(runsPerWeek) : "≈ " + runsPerWeek], ["Longest time limit", acts.length ? Math.max(...acts.map((x) => x.t)) + "s" : "—"]].map(([k, v]) => html`<div key=${k}><div className="k">${k}</div><div className="v">${v}</div></div>`)}
          </div>
          ${kind === "Threshold" && bt.now.length ? note(`Already true on ${bt.now.join(", ")} right now. It would fire as soon as you save.`, true) : null}
          ${total > 40 ? note("That is a lot. Raise the line or the wait so it fires only when it matters.", true) : null}
          ${problems.map((x) => html`<div key=${x}>${note(x, true)}</div>`)}
        </div>
      </div>
    <//>
    ${bar}
  </div><//>`;
}

const TEMP_PY = `import os
import time
from pathlib import Path

LIMIT_DAYS = 7
temp = Path(os.environ["TEMP"])
cutoff = time.time() - LIMIT_DAYS * 86400
removed = 0
for f in temp.rglob("*"):
    try:
        if f.is_file() and f.stat().st_mtime < cutoff:
            f.unlink()
            removed += 1
    except OSError:
        pass  # in use; try again next time
print(f"removed {removed} files")`;
const MAP_PS = `$share = "\\\\fileserver\\common"
if (-not (Get-PSDrive -Name S -ErrorAction SilentlyContinue)) {

}
Write-Output "S: is $share"`;

  { id: "shot", name: "Take a screenshot", cat: "Monitoring", desc: "Saves what is on screen to the record.", limit: 30, names: ["Take a screenshot"], impact: () => "Users are not interrupted. The screenshot is kept in the record." },

  { id: "procs", name: "List running programs", cat: "Monitoring", desc: "Every process, with its memory and open files.", limit: 20, names: ["List running programs"], impact: () => "Users are not interrupted." },

  if (f.mb > FILE_MAX_MB) return { no: true, say: `It is ${fmtMb(f.mb)}; a conversation carries up to ${FILE_MAX_MB} MB. Something this size goes by a Flow.` };
  if (f.tag === "private") return f.owner === me ? { adds: true, say: `This file is private. Sending it adds ${who} to the people who may open it.` }
    : { wait: true, say: `This file is private to ${ownerName(f.owner)}. They are asked first, and ${who} get it when they agree; agreeing adds ${who} to who may open it.` };
  if (f.tag === "keep") return f.owner === me ? { consent: true, say: `This file is restricted. Sending it is your consent for this one copy to ${who}; the copy is known and recorded.` }
    : { wait: true, say: `This file is restricted by ${ownerName(f.owner)}. They are asked to consent to this one copy first.` };
  if (f.tag === "watch") return { say: `${who} get a copy in Downloads\\From Falcon. The file is watched, so the copy is noted.` };

// as a rail of cards with what is recommended; the organisation as a map of machines, calm, only the lagging marked; four
// tiles beside it, ending level with it; today as a strip of hours with Now marked.
// A day as seven two-hour columns with Now kept in the middle (the user, 23 Oct 2026). The strip moves with the clock, so
// what is coming shows as it becomes relevant and what is past fades; what is earlier and still open, and what is later,
// are counted at the foot. Items: { at, title, line, late, ann, to }.
function DayStrip({ items, go, empty }) {
  useNow(60000);
  const now = NOWH + (Date.now() - T0) / 3.6e6, c0 = 2 * Math.floor(now / 2) - 6, end = c0 + 14, cols = Array.from({ length: 7 }, (_, k) => c0 + k * 2);
  const inW = items.filter((e) => e.at >= c0 && e.at < end), before = items.filter((e) => e.at < c0 && e.late), after = items.filter((e) => e.at >= end);
  const dayOfH = (h) => Math.floor(h / 24), label = (h, k) => `${(k === 0 || dayOfH(h) !== dayOfH(cols[k - 1])) && dayOfH(h) !== dayOfH(now) ? CAL_DAY0.add(dayOfH(h), "day").format("ddd") + " " : ""}${hhmm(h)}`;
  return html`<div className="ds">

          ${es.length > 2 ? html`<a className="ovh-col-more" onClick=${() => go("calendar")}>+${fmt(es.length - 2)} more</a>` : null}</div>`; })}
      <span className="ovh-now" style=${{ left: `${((now - c0) / 14) * 100}%` }}><b>Now ${hhmm(now)}</b></span>
    </div>
    <div className="ds-foot">${before.length ? html`<a onClick=${() => go("calendar")}>‹ ${fmt(before.length)} earlier, still open</a>` : html`<span />`}
      <span className="t3">${inW.length ? `${fmt(inW.length)} in these 14 hours; it moves on as the day does` : empty}</span>
      ${after.length ? html`<a onClick=${() => go("calendar")}>${fmt(after.length)} later ›</a>` : html`<span />`}</div>
  </div>`;
}

  const setAsk = (v) => { setAsk0(v); try { localStorage.setItem("falcon-ask", v ? "on" : "off"); } catch (e) { /* this visit only */ } };
  const flipPulse = () => { const v = !pulse; setPulse(v); v ? document.documentElement.removeAttribute("data-pulse") : document.documentElement.setAttribute("data-pulse", "off");
    try { localStorage.setItem(PULSE_KEY, v ? "on" : "off"); } catch (e) { /* this visit only */ }
    toast(v ? "A section a click changes pulses once" : "Pulsing is off"); };
  const [level] = useState({ admin: "R. Mensah", dept: "ops" });   // the Admin at this console
  const parse = () => { const [p, s0] = (location.hash.slice(1) || "overview").split("/"); return [TITLES[p] ? p : "overview", s0 ? decodeURIComponent(s0) : null]; };
  const [[rawPage0, sub0], setRoute] = useState(parse);
  const [range, setRange] = useState("24h");
  const [pal, setPal] = useState(false);
  const now = useNow(1000);
  // version 1 (1 Nov 2026, docs/design/v1-it-admin.md): the console is an IT Admin's, and an Admin reaches every

  applyScope(null);
  ME = level.admin;
  let [rawPage, sub] = [rawPage0, sub0];
  // every Admin sees everything, but a flow or a rule stays its maker's to change: an address that opens another

  let refused = null;
  if (sub) {

    if (fl && fl.by !== level.admin) refused = `The ${fl.name} flow was made by ${fl.by}. Only they can change it.`;
    else if (ru && ru.by !== level.admin) refused = `${ru.name} was made by ${ru.by}. Only they can change it.`;
    if (refused) sub = ru ? ru.id : null;
  }
  const nav = NAV_ADMIN;
  const allowed = new Set(nav.flatMap(([, xs]) => xs.map((x) => x[0])));
  const page = allowed.has(rawPage) ? rawPage : rawPage === "registry" ? "machines" : "overview";
  const goRaw = (p, s0) => { setRoute([p, s0 || null]); try { history.replaceState(null, "", "#" + p + (s0 ? "/" + encodeURIComponent(s0) : "")); } catch (e) {} if (p !== page || p !== "issues") window.scrollTo(0, 0); };
  const go = (p, s0) => goRaw(p, s0);
  // what a page's own buttons use: the same page just picks; another page is asked first
  const [askM, askCtx] = Modal.useModal();
  const goAsk = (p, s0) => {
    const land = () => { ARRIVE = { page: p, sub: s0 || null }; goRaw(p, s0); setTimeout(arriveNow, 450); };
    if (p === page || !ask) return land();
    const to = (TITLES[p] || [p])[0], what = arriveWhat(p, s0); let quiet = false;
    askM.confirm({ title: `Open ${to}?`, okText: `Open ${to}`, cancelText: "Stay here",
      content: html`<div>${what ? what + " " : ""}This leaves ${(TITLES[page] || [page])[0]}; the menu brings you back.</div>
        <${Checkbox} style=${{ marginTop: 12 }} onChange=${(e) => { quiet = e.target.checked; }}>Don't ask again<//>`,
      onOk: () => { if (quiet) { setAsk(false); toast("Pages open without asking now; turn it back on under your name"); } land(); } }); };
  useEffect(() => { const k = (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setPal((v) => !v); } };
    const h = () => setRoute(parse());
    window.addEventListener("keydown", k); window.addEventListener("hashchange", h); return () => { window.removeEventListener("keydown", k); window.removeEventListener("hashchange", h); }; }, []);
  const dk = th.dark;
  // controls at the console's own sizes (13 Oct 2026): text 13px, controls 30px (24 small, 36 large), as the Qt console
  // draws them. antd's compact algorithm used to shrink every control to 10px text, which nobody chose.
  const cfg = { algorithm: [dk ? theme.darkAlgorithm : theme.defaultAlgorithm],
    token: { colorPrimary: dk ? "#5b8cff" : "#2459d6", borderRadius: 4, fontFamily: "'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif", fontSize: 13, fontSizeSM: 12, fontSizeLG: 14, controlHeight: 30, controlHeightSM: 24, controlHeightLG: 36,
             colorBgContainer: dk ? "#12161d" : "#ffffff", colorBgElevated: dk ? "#161b23" : "#ffffff", colorBorder: dk ? "#323b48" : "#cdd2da", colorBorderSecondary: dk ? "#232a35" : "#e2e5ea",
             colorBgLayout: dk ? "#0c0f14" : "#f3f4f6", colorText: dk ? "#e4e7ed" : "#191d25", colorError: dk ? "#f2604c" : "#c8331f" },
    components: { Table: { headerBg: dk ? "#161b23" : "#f8f9fb", rowHoverBg: dk ? "#1d232d" : "#f8f9fb" } } };
  const [title0, subtitle0] = TITLES[page];
  const title = title0, subtitle = page === "overview" ? `Every department · ${fmt(MACHINES.length)} machines · as ${level.admin} sees it` : subtitle0;
  const secs = Math.floor(((now - T0) / 1000) % 15);
  let body;
  if (page === "departments") body = html`<${AdminDepartmentsPage} go=${goAsk} />`;
  else if (page === "messages") body = html`<${AdminMessagesPage} key=${ME + (sub || "")} go=${goAsk} open=${sub} />`;
  else if (page === "announcements") body = html`<${AdminAnnouncementsPage} />`;
  else if (page === "calendar") body = html`<${AdminCalendarPage} key=${level.dept} go=${goAsk} level=${level} />`;
  else if (page === "overview") body = html`<${AdminOverviewPage} go=${goAsk} />`;
  // the Admin has no page for one machine: a machine named anywhere opens Machines with it picked
  else if (page === "machines") body = html`<${AdminMachinesPage} key=${sub || ""} go=${goAsk} start=${sub && MBY[sub] ? sub : null} />`;
  else if (page === "issues") body = html`<${AdminIssuesPage} sel=${sub} go=${goAsk} />`;
  else if (page === "tasks") body = sub === "new" ? html`<${NewTask} go=${goAsk} />` : html`<${AdminTasksPage} key=${sub || "tasks"} go=${goAsk} open=${sub && TASKS.some((t) => t.id === sub) ? sub : null} />`;
  else if (page === "flows") body = html`<${AdminFlowsPage2} key=${sub || "flows"} go=${goAsk} open=${sub} />`;
  else if (page === "detective") body = html`<${AdminDetectivePage} key=${ME} go=${goAsk} />`;
  else if (page === "restricted") body = sub === "mark" ? html`<${MarkPage} go=${goAsk} me=${ME} />` : html`<${AdminRestrictedPage} key=${ME} go=${goAsk} />`;
  else if (page === "actions") body = sub === "new" ? html`<${NewAction} go=${goAsk} />` : sub && sub.startsWith("edit-") && ABY[sub.slice(5)] ? html`<${NewAction} key=${sub} go=${goAsk} from=${ABY[sub.slice(5)]} />` : html`<${AdminActionsLayout} key=${sub || "actions"} host=${sub && MBY[sub] ? sub : null} />`;
  else if (page === "automation") body = sub === "new" || (sub && sub.startsWith("edit-") && RBY[sub.slice(5)]) ? html`<${NewRule} key=${sub} go=${goAsk} from=${sub === "new" ? null : sub.slice(5)} />` : html`<${AdminAutomationPage} key=${ME + (sub || "")} go=${goAsk} open=${sub && RBY[sub] ? sub : null} />`;
  else body = html`<${AdminAuditPage} key=${ME} range=${range} go=${goAsk} />`;
  const usesRange = ["overview", "machines", "audit"].includes(page);
  const openSub = !!sub && (page === "restricted" ? sub !== "mark" : (page === "flows" && !!FBY[sub]) || (page === "tasks" && TASKS.some((t) => t.id === sub)) || (page === "automation" && !!RBY[sub]) || (page === "actions" && (!!ABY[sub] || !!MBY[sub])));
  const csub = openSub ? null : sub;
  const crumb = csub && page === "actions" ? html`<a onClick=${() => go("actions")}>Actions</a><span>/</span>${sub.startsWith("edit-") && ABY[sub.slice(5)] ? html`<a onClick=${() => go("actions", sub.slice(5))}>${ABY[sub.slice(5)].name}</a><span>/</span><b>Edit</b>` : html`<b>${sub === "new" ? "New custom action" : ABY[sub] ? ABY[sub].name : sub}</b>`}`
    : csub && page === "flows" ? html`<a onClick=${() => go("flows")}>Flows</a><span>/</span><b>${sub.startsWith("edit-") ? "Edit " + sub.slice(5) : "New flow"}</b>`
    : csub && page === "automation" ? html`<a onClick=${() => go(page)}>Automation</a><span>/</span>${sub.startsWith("edit-") && RBY[sub.slice(5)] ? html`<a onClick=${() => go("automation", sub.slice(5))}>${RBY[sub.slice(5)].name}</a><span>/</span><b>Edit</b>` : html`<b>${sub === "new" ? "New rule" : RBY[sub] ? RBY[sub].name : sub}</b>`}`
    : csub && page === "restricted" ? html`<a onClick=${() => go(page)}>Restricted</a><span>/</span><b>Mark files</b>`
    : csub && page === "tasks" ? html`<a onClick=${() => go(page)}>Tasks</a><span>/</span>${sub === "new" ? html`<b>New task</b>` : html`<b className="mono">${sub}</b>`}`
    : html`<b>${title}</b>`;
  return html`<${ConfigProvider} theme=${cfg} renderEmpty=${() => html`<div className="t3" style=${{ padding: "22px 0", fontSize: 12.5, textAlign: "center" }}>Nothing here yet.</div>`}>${askCtx}
    <div className="app">
      <aside className="side">
        <div className="org"><span className="logo"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 12L7 2L13 12L7 9Z" style=${{ fill: "var(--surface)" }} /></svg></span>
            <div className="orgtxt"><div style=${{ fontWeight: 600 }}>Falcon</div><div className="t3" style=${{ fontSize: 11.5 }}>IT console · ${fmt(DEPTS.length)} department${DEPTS.length === 1 ? "" : "s"}</div></div></div>
        ${nav.map(([g, xs]) => {
          const items = xs.map(([id, l, icon, cnt, hot, pulse]) => { const on = page === id, n = typeof cnt === "function" ? cnt() : cnt;
            return html`<div key=${id} className=${"nav" + (on ? " on" : "")} role="link" tabIndex="0" onClick=${() => go(id)} onKeyDown=${(e) => e.key === "Enter" && go(id)}>
            ${ic(icon)}<span>${l}</span>${n ? html`<span className=${"cnt" + (hot ? " hot" : "") + (pulse ? " pulse" : "")}>${n > 999 ? "999+" : fmt(n)}</span>` : null}</div>`; });
          return html`<${React.Fragment} key=${g || "su"}>${g ? html`<div className="grp">${g}</div>` : html`<div style=${{ height: 8 }} />`}${items}<//>`; })}
        <div className="side-foot">
          
          <div className="row" style=${{ flexWrap: "nowrap" }}><span style=${{ width: 24, height: 24, borderRadius: 4, background: "var(--surface-3)", display: "grid", placeItems: "center", fontSize: 11, fontWeight: 600 }}>${initials(level.admin)}</span><div><div style=${{ fontWeight: 500 }}>${level.admin}</div><div className="t3 mono" style=${{ fontSize: 11 }}>${(ADMIN_INFO[level.admin] || {}).ws}</div></div></div>
          <span className="t3" style=${{ fontSize: 11.5, whiteSpace: "normal" }}>${ask ? "Asks before opening another page · " : "Opens other pages without asking · "}<a onClick=${() => { setAsk(!ask); toast(ask ? "Pages open without asking now" : "Asks before opening another page again"); }}>${ask ? "Stop asking" : "Ask again"}</a></span>
          <span className="t2" style=${{ fontSize: 11.5, fontWeight: 600 }} title="Which published version of the concept this is">Admin concept, 3 Nov 2026</span>
          <span className="t4" style=${{ fontSize: 11, whiteSpace: "normal" }} title="The large sample checks that nothing grows with the data">Concept · sample:
            ${["empty", "small", "large", "absurd"].map((v, k) => html`<${React.Fragment} key=${v}>${k ? " · " : " "}<a style=${{ color: SAMPLE_SIZE === v ? "var(--accent)" : "var(--text-3)", fontWeight: SAMPLE_SIZE === v ? 600 : 400, cursor: "pointer" }} onClick=${() => SAMPLE_SIZE !== v && setSample(v)}>${v}</a><//>`)}</span>
        </div>
      </aside>
      <div className="main">
        ${(() => { const due = todoOpen().filter((t) => t.due < NOWH + 24 && !TODO_HUSH.has(t.id)); if (!due.length) return null;
          const x = due[0], late = x.due < NOWH, d0 = Math.floor(NOWH / 24);
          return html`<div className="newtask" role="alert">
            <span className="nt-ico">${ic("CheckSquareFilled")}</span>
            <b style=${{ fontWeight: 600, flex: "none" }}>${late ? "Past its date" : Math.floor(x.due / 24) === d0 ? "Due today" : "Due tomorrow"}</b>
            <span className="nt-t" title=${x.title}>${x.title}</span>
            <span className="mono" style=${{ flex: "none", color: late ? "var(--crit)" : "inherit" }}>due ${atH(x.due)}</span>
            ${due.length > 1 ? html`<span className="t3" style=${{ flex: "none" }}>and ${fmt(due.length - 1)} more</span>` : null}

            <${Button} size="small" type="primary" onClick=${() => { todoDone(x.id, true); toast(`Done: ${x.title}`); }}>Done<//>
          </div>`; })()}
        <header className="top">
          <div className="crumb">${crumb}</div>
          <div className="search" role="button" tabIndex="0" onClick=${() => setPal(true)} onKeyDown=${(e) => e.key === "Enter" && setPal(true)}>${ic("SearchOutlined")}<span>Search or jump to</span><span className="kbd">Ctrl K</span></div>
          <div className="top-r">
          ${usesRange ? html`<${Segmented} size="small" value=${range} onChange=${setRange} options=${["1h", "6h", "24h", "7d"]} />` : null}
          <span className="live"><i />Live · ${secs}s ago</span>
          <${Segmented} size="small" value=${th.mode} onChange=${th.setMode} options=${[{ value: "system", icon: ic("DesktopOutlined"), title: "System" }, { value: "light", icon: ic("SunOutlined"), title: "Light" }, { value: "dark", icon: ic("MoonOutlined"), title: "Dark" }]} />
          <${Button} size="small" type=${pulse ? "default" : "text"} icon=${ic("BulbOutlined")} aria-pressed=${pulse} aria-label="Pulse what a click changes"
            title=${pulse ? "A section a click changes pulses once. Click to turn it off" : "Pulsing is off. Click to turn it on"} onClick=${flipPulse} className=${pulse ? "" : "t4"} />
          </div>
        </header>
        <main className="content">
          ${!csub || !["machines", "tasks", "automation", "flows", "actions", "restricted"].includes(page) ? html`<div className="ph1"><div><h1>${title}</h1>${subtitle ? html`<div className="sub">${subtitle}</div>` : null}</div></div>` : null}
          ${refused ? html`<div className="gate"><span style=${{ fontSize: 16 }}>${ic("StopOutlined")}</span><div><b style=${{ fontWeight: 600 }}>That is not this console's.</b> <span className="t2">${refused}</span></div></div>` : null}
          ${body}
        </main>
      </div>
    </div>
    ${pal ? html`<${Palette} go=${go} nav=${nav} close=${() => setPal(false)} />` : null}
    <${SessionWindow} />
    <${Toast} />
  <//>`;
}
// Empty: the first day. No departments, no machines, nothing has happened. Everything is built first
// and then emptied, so every list on every page is seen at zero.
if (EMPTY) Object.values(ADMIN_INFO).forEach((a) => { a.busy = false; a.now = "At their desk"; });
if (EMPTY) [DEPTS, MACHINES, ISSUES, LANES, TASKS, AUDIT, MARKS, MANUAL_RUNS, RULES, RUNS, ALL_RUNS, LIVE_POOL, DEVIATIONS, ORG_RULES].forEach((a) => { a.length = 0; });
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
